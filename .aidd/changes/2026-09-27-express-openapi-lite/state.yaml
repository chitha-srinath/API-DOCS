intent: "Build express-openapi-lite (working name): a TypeScript-first npm package that generates OpenAPI 3.1 docs for Express from route definitions with near-zero config. Zod schemas go through a pluggable SchemaAdapter interface (Zod adapter ships first; other schema libraries additive later without breaking changes). Required: typed route helper that validates requests and infers handler types; automatic path/query/body/response/params docs; security schemes (bearer, apiKey, oauth2) declared once; a docs UI endpoint (Scalar or Swagger UI via CDN, no bundled assets); a JSON spec endpoint; incremental adoption on existing routers; ESM+CJS dual build with .d.ts; tests with >=90% coverage; README, examples, CHANGELOG, CI, and npm publish config."
