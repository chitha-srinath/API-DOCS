<!doctype html>
<!-- AIDD Delta dashboard — self-contained; regenerated by render-dashboard.sh.
     The render script substitutes the state marker below with {global, change} JSON. -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIDD Delta — Pipeline</title>
<style>
:root{
  --bg:#f5f5f7;--surface:#ffffff;--surface-2:#fbfbfd;--line:rgba(0,0,0,.08);
  --fg:#1d1d1f;--dim:#6e6e73;--faint:#a1a1a6;
  --accent:#0071e3;--ok:#248a3d;--warn:#b25000;--bad:#d70015;
  --ok-bg:rgba(36,138,61,.10);--warn-bg:rgba(178,80,0,.10);--bad-bg:rgba(215,0,21,.09);--accent-bg:rgba(0,113,227,.10);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
  --radius:16px;--ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000;--surface:#1c1c1e;--surface-2:#232326;--line:rgba(255,255,255,.10);
    --fg:#f5f5f7;--dim:#98989d;--faint:#636366;
    --accent:#2997ff;--ok:#30d158;--warn:#ff9f0a;--bad:#ff453a;
    --ok-bg:rgba(48,209,88,.14);--warn-bg:rgba(255,159,10,.14);--bad-bg:rgba(255,69,58,.14);--accent-bg:rgba(41,151,255,.16);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#000000;--surface:#1c1c1e;--surface-2:#232326;--line:rgba(255,255,255,.10);
  --fg:#f5f5f7;--dim:#98989d;--faint:#636366;
  --accent:#2997ff;--ok:#30d158;--warn:#ff9f0a;--bad:#ff453a;
  --ok-bg:rgba(48,209,88,.14);--warn-bg:rgba(255,159,10,.14);--bad-bg:rgba(255,69,58,.14);--accent-bg:rgba(41,151,255,.16);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;padding:40px 24px 64px}
.wrap{max-width:1040px;margin:0 auto}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px;animation:rise .5s var(--ease) both}
h1{font-size:28px;font-weight:650;letter-spacing:-.02em;margin:0}
.meta{color:var(--dim);font-size:13px;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 14px}
.meta b{font-weight:500;color:var(--fg)}

h2{font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin:32px 0 12px 4px}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;
  animation:rise .5s var(--ease) both;transition:box-shadow .3s var(--ease)}
.card:hover{box-shadow:0 2px 4px rgba(0,0,0,.05),0 10px 28px rgba(0,0,0,.07)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.grid .card{margin:0}

/* phase stepper */
.stepper{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;position:relative}
.step{position:relative;text-align:center;padding:12px 4px 10px;border-radius:12px;color:var(--faint);
  font-size:12px;font-weight:500;text-transform:capitalize;transition:background .35s var(--ease),color .35s var(--ease)}
.step::before{content:"";display:block;width:8px;height:8px;margin:0 auto 8px;border-radius:50%;background:var(--line);transition:background .35s var(--ease),transform .35s var(--ease)}
.step.done{color:var(--dim)}
.step.done::before{background:var(--ok)}
.step.active{color:var(--fg);background:var(--accent-bg);font-weight:600}
.step.active::before{background:var(--accent);transform:scale(1.35);animation:pulse 2s ease-in-out infinite}
.bar{height:3px;border-radius:3px;background:var(--line);margin-top:18px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transform-origin:left;animation:fill .9s var(--ease) both}
@media (max-width:720px){.stepper{grid-template-columns:repeat(4,1fr)}}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface-2);
  border:1px solid var(--line);font-size:12px;color:var(--dim)}
.chip b{font-weight:600;color:var(--fg)}

/* key/value rows */
.kv{width:100%;border-collapse:collapse}
.kv th,.kv td{padding:10px 0;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.kv tr:last-child th,.kv tr:last-child td{border-bottom:0}
.kv th{font-weight:400;color:var(--dim);width:55%}
.kv td{text-align:right;font-variant-numeric:tabular-nums}

/* tables */
.table-wrap{overflow-x:auto;margin:0 -8px}
table.list{width:100%;border-collapse:collapse;min-width:480px}
table.list th,table.list td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.list tr:last-child td{border-bottom:0}
table.list th{font-size:12px;font-weight:500;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
table.list tbody tr{transition:background .2s var(--ease)}
table.list tbody tr:hover{background:var(--surface-2)}
td.mono,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.empty{color:var(--dim);padding:8px 0}

/* status pill */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:500;
  background:var(--surface-2);color:var(--dim);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:var(--ok-bg)}
.pill.warn{color:var(--warn);background:var(--warn-bg)}
.pill.bad{color:var(--bad);background:var(--bad-bg)}
.pill.dim{color:var(--dim)}
.pill.warn::before{animation:pulse 1.6s ease-in-out infinite}

.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.dim{color:var(--dim)}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--dim)}
.badge.ok{color:var(--ok);background:var(--ok-bg)}.badge.warn{color:var(--warn);background:var(--warn-bg)}.badge.bad{color:var(--bad);background:var(--bad-bg)}
.rigor-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}

details.section{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;animation:rise .5s var(--ease) both}
details.section>summary{list-style:none;cursor:pointer;padding:16px 20px;font-size:12px;font-weight:600;color:var(--dim);
  text-transform:uppercase;letter-spacing:.08em;display:flex;justify-content:space-between;align-items:center;user-select:none}
details.section>summary::-webkit-details-marker{display:none}
details.section>summary::after{content:"";width:8px;height:8px;border-right:1.5px solid var(--faint);border-bottom:1.5px solid var(--faint);
  transform:rotate(45deg) translate(-2px,-2px);transition:transform .3s var(--ease)}
details.section[open]>summary::after{transform:rotate(225deg) translate(-2px,-2px)}
details.section>.body{padding:0 20px 20px}
details.section>summary:hover{color:var(--fg)}

/* theme toggle */
.theme{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--dim);border-radius:999px;
  padding:6px 12px;font:inherit;font-size:12px;cursor:pointer;transition:color .2s,border-color .2s,transform .15s var(--ease)}
.theme:hover{color:var(--fg)}
.theme:active{transform:scale(.97)}
.theme:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:560px){body{padding:24px 16px 48px}h1{font-size:24px}.card{padding:16px}}
</style></head><body>
<div class="wrap">
  <header>
    <div>
      <h1>AIDD Delta</h1>
      <div class="meta" id="meta"></div>
    </div>
    <button class="theme" id="theme" type="button" aria-label="Toggle theme">Theme</button>
  </header>

  <h2>Pipeline</h2>
  <div class="card"><div class="stepper" id="phases"></div><div class="bar" id="bar"><i></i></div></div>

  <div class="grid" style="margin-top:16px">
    <div class="card"><h2 style="margin:0 0 12px">Rigor &amp; cost</h2><div id="rigorcost"></div></div>
    <div class="card"><h2 style="margin:0 0 12px">Recent progress</h2><div class="table-wrap"><table class="list" id="prog"></table></div></div>
  </div>

  <h2>Gates</h2>
  <div class="card"><div class="table-wrap"><table class="list" id="gates"><tr><th>Gate</th><th>Status</th><th>Approved by</th><th>At</th></tr></table></div></div>

  <h2>Quality gates</h2>
  <div class="card"><div class="table-wrap"><table class="list" id="qg"><tr><th>Quality gate</th><th>Status</th><th>Reason</th></tr></table></div></div>

  <h2>Stories</h2>
  <div class="card"><div class="table-wrap"><table class="list" id="stories"><tr><th>Story</th><th>Wave</th><th>Status</th><th>Attempts</th></tr></table></div></div>

  <h2>Details</h2>
  <details class="section"><summary>Supervision</summary><div class="body"><div class="table-wrap"><table class="list" id="sup"></table></div></div></details>
  <details class="section"><summary>History</summary><div class="body"><div class="table-wrap"><table class="list" id="hist"></table></div></div></details>
</div>

<script>
const DATA = __AIDD_STATE_JSON__;
const PHASES = ["document","master","inception","construction","qa","delivery","retro","done"];
const g = DATA.global || {}, c = DATA.change || {};

// Escape anything read from state files before it reaches innerHTML.
const esc = v => String(v ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const cls = s => ({passed:"ok",approved:"ok",auto:"ok",compliant:"ok",done:"ok",complete:"ok",
  pending:"dim",queued:"dim",awaiting:"warn",awaiting_gate:"warn",in_progress:"warn",stale:"warn",
  failed:"bad",blocked:"bad",violations:"bad",aborted:"bad"}[s]||"dim");
const pill = s => `<span class="pill ${cls(s)}">${esc(s ?? "—")}</span>`;
const rowsInto = (el, rows) => el.insertAdjacentHTML("beforeend", rows.join(""));

// Header meta
document.getElementById("meta").innerHTML =
  `<span>change <b>${esc(c.change_id || "—")}</b></span>` +
  `<span>mode <b>${esc(c.mode || g.default_mode || "—")}</b></span>` +
  `<span>status <b>${esc(c.phase_status || "idle")}</b></span>` +
  `<span>step <b>${esc(c.step || "—")}</b></span>`;

// Stepper + progress bar
const idx = PHASES.indexOf(c.phase);
document.getElementById("phases").innerHTML = PHASES.map((p,i)=>
  `<div class="step ${i<idx?"done":i===idx?"active":""}" style="animation:rise .5s var(--ease) ${i*40}ms both">${esc(p)}</div>`).join("");
const pct = idx < 0 ? 0 : Math.round(((idx + (c.phase_status === "done" ? 1 : 0.5)) / PHASES.length) * 100);
document.querySelector("#bar i").style.width = pct + "%";

// Rigor + cost + quarantine. Never prints 0 for something that was not measured:
// an absent block reads "not recorded", an unmeasured projection "not measured"
// (protocol/cost-governance.md §3, protocol/determinism.md §5).
const rg = c.rigor || {}, co = c.cost || {}, dm = c.determinism || {};
const num = v => (v === null || v === undefined) ? null : Number(v).toLocaleString();
const pair = (s, b) => (num(s) === null && num(b) === null)
  ? `<span class="dim">not recorded</span>` : `${esc(num(s) ?? "—")} / ${esc(num(b) ?? "—")}`;
const stops = (co.stops || []), quar = (dm.quarantined || []), esc_ = (c.escapes || []);
const openStops = stops.filter(s => s && s.disposition === "pending").length;
const openQuar = quar.filter(q => q && q.disposition === "pending").length;
const count = (n, open, what) => n === 0 ? `<span class="dim">none</span>`
  : `<span class="${open ? "bad" : "warn"}">${n} ${what}${open ? ` · ${open} unresolved` : ""}</span>`;
const rigorMode = rg.mode || "not recorded";
document.getElementById("rigorcost").innerHTML =
  `<div class="rigor-row">
     <span class="badge ${rg.mode === "critical" ? "bad" : rg.mode === "fast" ? "" : "warn"}">rigor · ${esc(rigorMode)}</span>
     <span class="badge">chosen by ${esc(rg.selected_by || "—")}</span>
     <span class="badge">${(rg.escalations || []).length} escalations</span>
   </div>
   <table class="kv">
     <tr><th>Tokens · spent / budget</th><td>${pair(co.spent_tokens, co.budget_tokens)}</td></tr>
     <tr><th>Minutes · spent / budget</th><td>${pair(co.spent_minutes, co.budget_minutes)}</td></tr>
     <tr><th>Projection</th><td>${num(co.projection_tokens) ?? `<span class="dim">not measured</span>`}</td></tr>
     <tr><th>Cost stops</th><td>${count(stops.length, openStops, "recorded")}</td></tr>
     <tr><th>Quarantined tests</th><td>${count(quar.length, openQuar, "quarantined")}</td></tr>
     <tr><th>Escapes analyzed</th><td>${count(esc_.length, 0, "recorded")}</td></tr>
   </table>`;

// Recent progress
const PROG = DATA.progress || [];
const pr = document.getElementById("prog");
if (!PROG.length) rowsInto(pr, [`<tr><td class="empty">No progress lines recorded yet — see protocol/progress.md</td></tr>`]);
rowsInto(pr, PROG.map(p => `<tr><td class="dim mono" style="white-space:nowrap">${esc(p.at)}</td>
  <td class="${p.shape==="plain"?"dim":p.state==="blocked"?"bad":""}">${esc(p.line)}</td></tr>`));

// Gates
rowsInto(document.getElementById("gates"), Object.entries(c.gates||{}).map(([k,v]) =>
  `<tr><td class="mono">${esc(k)}</td><td>${pill(v.status)}</td><td>${esc(v.approved_by ?? "—")}</td><td class="dim mono">${esc(v.at ?? "—")}</td></tr>`));

// A gate is either the single-value status or {status, reason} — the encoding a rigor-skipped
// gate must use to carry its reason (protocol/gates.md §The `na` encoding). Both render,
// and the reason is shown, because an `na` whose reason is invisible is the thing the
// protocol forbids.
rowsInto(document.getElementById("qg"), Object.entries(c.quality_gates||{}).map(([k,v]) => {
  const obj = v && typeof v === "object";
  const status = obj ? v.status : v, reason = obj ? v.reason : null;
  return `<tr><td class="mono">${esc(k)}</td><td>${pill(status)}</td><td class="dim">${esc(reason ?? "—")}</td></tr>`;
}));

// Stories
rowsInto(document.getElementById("stories"), Object.entries(c.stories||{}).map(([k,v]) =>
  `<tr><td class="mono">${esc(k)}</td><td>${esc(v.wave ?? "—")}</td><td>${pill(v.status)}</td><td>${esc(v.attempts ?? 0)}</td></tr>`));

// Supervision + history (collapsed by default)
rowsInto(document.getElementById("sup"), Object.entries(c.supervision||{}).map(([k,v]) =>
  `<tr><td class="mono">${esc(k)}</td><td>${pill(v)}</td></tr>`));
rowsInto(document.getElementById("hist"), (c.history||[]).slice(-20).reverse().map(e =>
  `<tr><td class="dim mono" style="white-space:nowrap">${esc(e.at)}</td><td>${esc(e.event)}</td></tr>`));

// Theme toggle: explicit choice persists per viewer; otherwise follows the OS.
const root = document.documentElement, btn = document.getElementById("theme");
const label = () => btn.textContent = root.dataset.theme === "dark" ? "Dark" : root.dataset.theme === "light" ? "Light" : "Auto";
try { root.dataset.theme = localStorage.getItem("aidd-theme") || ""; } catch (_) {}
label();
btn.addEventListener("click", () => {
  const next = root.dataset.theme === "dark" ? "light" : root.dataset.theme === "light" ? "" : "dark";
  root.dataset.theme = next;
  try { next ? localStorage.setItem("aidd-theme", next) : localStorage.removeItem("aidd-theme"); } catch (_) {}
  label();
});
</script></body></html>
