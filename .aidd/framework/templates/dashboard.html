<!doctype html>
<!-- AIDD Delta dashboard — self-contained; regenerated by render-dashboard.sh.
     The render script substitutes the state marker below with {global, change} JSON. -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIDD Delta — Pipeline</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--fg:#e6edf3;--dim:#8b949e;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--acc:#58a6ff}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg);padding:24px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:14px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin:24px 0 8px}
.card{background:var(--card);border:1px solid #30363d;border-radius:8px;padding:16px;margin-bottom:12px}
.phases{display:flex;gap:8px;flex-wrap:wrap}.phase{flex:1;min-width:110px;text-align:center;padding:10px;border-radius:6px;border:1px solid #30363d}
.phase.done{border-color:var(--ok);color:var(--ok)}.phase.active{border-color:var(--acc);color:var(--acc);font-weight:600}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:6px 10px;border-bottom:1px solid #21262d}th{color:var(--dim);font-weight:500}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.dim{color:var(--dim)}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;border:1px solid #30363d;font-size:12px}
</style></head><body>
<h1>AIDD Delta</h1><div class="dim" id="meta"></div>
<h2>Phases</h2><div class="phases" id="phases"></div>
<h2>Rigor &amp; cost</h2><div class="card" id="rigorcost"></div>
<h2>Recent progress</h2><div class="card"><table id="prog"></table></div>
<h2>Gates</h2><div class="card"><table id="gates"><tr><th>Gate</th><th>Status</th><th>Approved by</th><th>At</th></tr></table></div>
<h2>Quality gates</h2><div class="card"><table id="qg"><tr><th>Quality gate</th><th>Status</th><th>Reason</th></tr></table></div>
<h2>Stories</h2><div class="card"><table id="stories"><tr><th>Story</th><th>Wave</th><th>Status</th><th>Attempts</th></tr></table></div>
<h2>Supervision</h2><div class="card"><table id="sup"></table></div>
<h2>History</h2><div class="card"><table id="hist"></table></div>
<script>
const DATA = __AIDD_STATE_JSON__;
const PHASES = ["document","master","inception","construction","qa","delivery","retro","done"];
const g = DATA.global || {}, c = DATA.change || {};
const cls = s => ({passed:"ok",approved:"ok",auto:"ok",compliant:"ok",done:"ok",complete:"ok",
  pending:"dim",queued:"dim",awaiting:"warn",awaiting_gate:"warn",in_progress:"warn",stale:"warn",
  failed:"bad",blocked:"bad",violations:"bad",aborted:"bad"}[s]||"dim");
document.getElementById("meta").textContent =
  `change: ${c.change_id||"—"} · mode: ${c.mode||g.default_mode||"—"} · status: ${c.phase_status||"idle"} · step: ${c.step||"—"}`;
const idx = PHASES.indexOf(c.phase);
document.getElementById("phases").innerHTML = PHASES.map((p,i)=>
  `<div class="phase ${i<idx?"done":i===idx?"active":""}">${p}</div>`).join("");
// Rigor + cost + quarantine. Never prints 0 for something that was not measured:
// an absent block reads "not recorded", an unmeasured projection "not measured"
// (protocol/cost-governance.md §3, protocol/determinism.md §5).
const rg = c.rigor || {}, co = c.cost || {}, dm = c.determinism || {};
const num = v => (v === null || v === undefined) ? null : Number(v).toLocaleString();
const pair = (s, b) => (num(s) === null && num(b) === null)
  ? `<span class="dim">not recorded</span>` : `${num(s) ?? "—"} / ${num(b) ?? "—"}`;
const stops = (co.stops || []), quar = (dm.quarantined || []), esc = (c.escapes || []);
const openStops = stops.filter(s => s && s.disposition === "pending").length;
const openQuar = quar.filter(q => q && q.disposition === "pending").length;
const count = (n, open, what) => n === 0 ? `<span class="dim">none</span>`
  : `<span class="${open ? "bad" : "warn"}">${n} ${what}${open ? ` · ${open} unresolved` : ""}</span>`;
document.getElementById("rigorcost").innerHTML =
  `<p><span class="badge ${rg.mode === "critical" ? "bad" : rg.mode === "fast" ? "dim" : "warn"}">rigor: ${rg.mode || "not recorded"}</span>
   <span class="badge dim">chosen by: ${rg.selected_by || "—"}</span>
   <span class="badge dim">escalations: ${(rg.escalations || []).length}</span></p>
   <table>
   <tr><th>tokens (spent / budget)</th><td>${pair(co.spent_tokens, co.budget_tokens)}</td></tr>
   <tr><th>minutes (spent / budget)</th><td>${pair(co.spent_minutes, co.budget_minutes)}</td></tr>
   <tr><th>projection</th><td>${num(co.projection_tokens) ?? `<span class="dim">not measured</span>`}</td></tr>
   <tr><th>cost stops</th><td>${count(stops.length, openStops, "recorded")}</td></tr>
   <tr><th>quarantined tests</th><td>${count(quar.length, openQuar, "quarantined")}</td></tr>
   <tr><th>escapes analyzed</th><td>${count(esc.length, 0, "recorded")}</td></tr>
   </table>`;
const pr = document.getElementById("prog");
const PROG = DATA.progress || [];
if (!PROG.length) pr.insertAdjacentHTML("beforeend",
  `<tr><td class="dim">no progress lines recorded yet — see protocol/progress.md</td></tr>`);
PROG.forEach(p=>pr.insertAdjacentHTML("beforeend",
  `<tr><td class="dim">${p.at}</td><td class="${p.shape==="plain"?"dim":p.state==="blocked"?"bad":""}">${p.line}</td></tr>`));
const gt = document.getElementById("gates");
Object.entries(c.gates||{}).forEach(([k,v])=>gt.insertAdjacentHTML("beforeend",
  `<tr><td>${k}</td><td class="${cls(v.status)}">${v.status}</td><td>${v.approved_by??"—"}</td><td class="dim">${v.at??"—"}</td></tr>`));
// A gate is either the scalar status or {status, reason} — the encoding a rigor-skipped
// gate must use to carry its reason (protocol/gates.md §The `na` encoding). Both render,
// and the reason is shown, because an `na` whose reason is invisible is the thing the
// protocol forbids.
const qg = document.getElementById("qg");
Object.entries(c.quality_gates||{}).forEach(([k,v])=>{
  const obj = v && typeof v === "object";
  const status = obj ? v.status : v, reason = obj ? v.reason : null;
  qg.insertAdjacentHTML("beforeend",
    `<tr><td>${k}</td><td class="${cls(status)}">${status??"—"}</td><td class="dim">${reason??"—"}</td></tr>`);
});
const st = document.getElementById("stories");
Object.entries(c.stories||{}).forEach(([k,v])=>st.insertAdjacentHTML("beforeend",
  `<tr><td>${k}</td><td>${v.wave??"—"}</td><td class="${cls(v.status)}">${v.status}</td><td>${v.attempts??0}</td></tr>`));
const sup = document.getElementById("sup");
Object.entries(c.supervision||{}).forEach(([k,v])=>sup.insertAdjacentHTML("beforeend",
  `<tr><td>${k}</td><td class="${cls(v)}">${v}</td></tr>`));
const h = document.getElementById("hist");
(c.history||[]).slice(-20).reverse().forEach(e=>h.insertAdjacentHTML("beforeend",
  `<tr><td class="dim">${e.at}</td><td>${e.event}</td></tr>`));
</script></body></html>
