name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
        express: [4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Report Express major
        run: echo "Testing against express major ${{ matrix.express }}"
      - name: Swap Express major
        if: matrix.express == 4
        run: npm i --no-save express@4.22.3 @types/express@4.17.25 @types/express-serve-static-core@4.19.9
      - run: npm run build
      - run: npm run lint
      - name: Test (v5, includes typecheck)
        if: matrix.express == 5
        run: |
          npm test
          npx tsc --noEmit
      - name: Test (v4)
        if: matrix.express == 4
        run: npm run test:v4

  peer-floor:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm i --no-save express@4.21.0
      - run: npm i --no-save express@5.0.0 router@2.0.0
      - run: npm i --no-save zod@4.2.0
      - run: npx vitest run test/introspect --passWithNoTests
      - run: npx vitest run test/adapter/standard-floor.test.ts --passWithNoTests

  mutation-scoped:
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # Stryker's dry run imports dist/ (tests resolve the package entry), so build first.
      - run: npm run build
      - uses: actions/cache@v4
        with:
          path: reports/stryker-incremental.json
          key: ${{ github.ref_name }}-${{ hashFiles('src/**','test/**') }}
          restore-keys: |
            main-
      - name: Run scoped mutation testing
        run: |
          CHANGED=$(git diff --name-only origin/main -- src/ | tr '\n' ',' | sed 's/,$//')
          if [ -z "$CHANGED" ]; then
            echo "::notice::No src/ changes; skipping mutation-scoped."
            exit 0
          fi
          npx stryker run --mutate "$CHANGED" --incremental
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: reports/stryker-incremental.json
          key: ${{ github.ref_name }}-${{ hashFiles('src/**','test/**') }}

  perf:
    runs-on: ubuntu-latest
    needs: [test]
    env:
      EXPRESS_MAJOR: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run perf
