name: Release

on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm (leave unticked to validate only)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read # list mutation-full.yml runs in the release gate
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check last mutation-full run
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'mutation-full.yml',
              per_page: 1,
            });
            const last = runs.data.workflow_runs[0];
            if (last && last.conclusion !== 'success') {
              core.setFailed('Last mutation-full run did not succeed; blocking release.');
            }
      - run: npm ci
      - run: npm run build
      - run: npm run check:pack
      - name: Verify tag matches package.json version
        if: github.ref_type == 'tag' || github.event_name == 'release'
        env:
          REF_NAME: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          if [ "v$pkg_version" != "$REF_NAME" ]; then
            echo "Tag $REF_NAME does not match package.json version v$pkg_version" >&2
            exit 1
          fi
      - name: Publish to npm
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        run: npm publish --provenance --access public
